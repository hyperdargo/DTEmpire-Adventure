<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>DTEmpire Adventure — Arcade Client</title>
    <link rel="icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      *{ margin:0; padding:0; box-sizing:border-box; }
      html,body{ height:100%; background:#0a0a0a; color:#e8e8e8;
        font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden;
        -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
      #stage{ position:fixed; inset:0; display:block; }
      #boot{ position:fixed; inset:0; display:grid; place-content:center; gap:14px;
        justify-items:center; background:#0a0a0a; z-index:50; }
      #boot img{ width:88px; height:88px; image-rendering:pixelated; }
      #boot p{ color:#8a8a8a; font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
      .bar{ width:220px; height:3px; background:#1d1d1d; overflow:hidden; }
      .bar i{ display:block; height:100%; width:40%; background:#d8b45a; animation:sweep 1.1s infinite; }
      @keyframes sweep{ 0%{transform:translateX(-100%)} 100%{transform:translateX(320%)} }
      @media (prefers-reduced-motion: reduce){ .bar i{ animation:none; width:100% } }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="boot">
      <img src="/icon-192.png" alt="DTEmpire Adventure" />
      <p>Loading Realm</p>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/arcade/main.ts"></script>
  </body>
</html>
