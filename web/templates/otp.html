<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/static/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DTEmpire — Insert Coin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#050505;color:#e8e8e8;font-family:'VT323',monospace;font-size:19px;min-height:100vh;overflow-x:hidden}
  a{color:#ffd54a;text-decoration:none}
  a:hover{text-shadow:0 0 8px #ffd54a}

  /* CRT scanlines + vignette */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.22) 0px,rgba(0,0,0,0.22) 1px,transparent 1px,transparent 3px);z-index:9998;mix-blend-mode:multiply}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,0.9);z-index:9997}

  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

  .cabinet{
    width:100%;max-width:420px;
    background:linear-gradient(180deg,#1a1a22,#0d0d13);
    border:4px solid #ffd54a;
    box-shadow:
      inset 0 0 0 2px #000,
      inset 0 0 0 6px #1a1a22,
      0 0 0 2px #000,
      6px 6px 0 #000,
      0 0 40px rgba(255,213,74,0.25);
    padding:32px 28px;
    text-align:center;
    position:relative;
  }
  .cabinet::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:1px dashed rgba(255,213,74,0.15);pointer-events:none}

  .marquee{
    font-family:'Press Start 2P',monospace;
    color:#ffd54a;
    font-size:18px;
    letter-spacing:3px;
    text-shadow:2px 2px 0 #000,0 0 14px #ffd54a;
    margin-bottom:6px;
  }
  .tagline{
    color:#888;font-size:16px;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px;
  }

  .logo-img{
    width:96px;height:96px;image-rendering:pixelated;margin:0 auto 18px;display:block;
    border:3px solid #ffd54a;
    box-shadow:inset 0 0 0 1px #000,0 0 20px rgba(255,213,74,0.5),4px 4px 0 #000;
  }

  .insert{
    font-family:'Press Start 2P',monospace;
    color:#ff4757;
    font-size:11px;
    letter-spacing:2px;
    margin:16px 0 22px;
    animation:blink 1s steps(2) infinite;
    text-shadow:0 0 10px rgba(255,71,87,0.6);
  }
  @keyframes blink{50%{opacity:0.2}}

  .discord-btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;padding:14px;
    background:linear-gradient(180deg,#5865F2,#3a44b0);
    color:#fff;border:3px solid #ffd54a;
    font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,0.5),4px 4px 0 #000;
    text-decoration:none;cursor:pointer;
    transition:transform .07s,box-shadow .07s;
  }
  .discord-btn:hover{background:linear-gradient(180deg,#6d78ff,#4a54c8)}
  .discord-btn:active{transform:translate(4px,4px);box-shadow:inset 0 -1px 0 rgba(0,0,0,0.5),0 0 0 #000}
  .discord-btn svg{width:22px;height:22px;fill:#fff}

  .divider{
    display:flex;align-items:center;margin:22px 0;color:#666;
    font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:2px;
  }
  .divider::before,.divider::after{content:'';flex:1;height:2px;background:#333;margin:0 12px}

  .field{margin-bottom:14px;text-align:left}
  .field label{display:block;font-family:'Press Start 2P',monospace;font-size:8px;color:#ffd54a;letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase}
  .field input{
    width:100%;padding:10px 12px;
    background:#0a0a0f;color:#ffd54a;
    border:2px solid #444;
    font-family:'VT323',monospace;font-size:20px;letter-spacing:1px;
    box-shadow:inset 0 0 0 1px #000;
  }
  .field input:focus{outline:none;border-color:#ffd54a;box-shadow:0 0 12px rgba(255,213,74,0.4)}

  .play-btn{
    width:100%;padding:14px;
    background:linear-gradient(180deg,#ffd54a,#c99a1a);
    color:#000;border:3px solid #000;
    font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,0.4),4px 4px 0 #000;
    cursor:pointer;margin-top:8px;
    transition:transform .07s,box-shadow .07s;
  }
  .play-btn:hover{filter:brightness(1.15)}
  .play-btn:active{transform:translate(4px,4px);box-shadow:inset 0 -1px 0 rgba(0,0,0,0.4),0 0 0 #000}

  .footer-note{margin-top:18px;color:#555;font-size:14px;letter-spacing:1px}

  .flash{background:#3a1a1a;border:2px solid #ff4757;color:#ff4757;padding:10px;margin-bottom:14px;font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;text-align:center}

  /* corner pixel decorations */
  .corners span{position:absolute;width:14px;height:14px;background:#ffd54a;box-shadow:0 0 8px #ffd54a}
  .corners .tl{top:-3px;left:-3px}
  .corners .tr{top:-3px;right:-3px}
  .corners .bl{bottom:-3px;left:-3px}
  .corners .br{bottom:-3px;right:-3px}
</style>
</head>
<body>

<div class="wrap">
  <div class="cabinet">
    <div class="corners">
      <span class="tl"></span><span class="tr"></span>
      <span class="bl"></span><span class="br"></span>
    </div>

    <img src="/static/icon-192.png" alt="DTEmpire" class="logo-img" onerror="this.style.display='none'">
    <div class="marquee">DTEMPIRE</div>
    <div class="tagline">◆ Verify Code ◆</div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}

    <div class="insert">▶ VERIFY CODE ◀</div>

    {% if error %}<div class="flash">{{ error }}</div>{% endif %}

    <p class="footer-note" style="margin-bottom:14px">We emailed a 6-digit code to {{ email_masked }}</p>

    <form method="POST" action="/otp">
      <div class="field">
        <label>6-Digit Code</label>
        <input type="text" name="code" placeholder="000000" required maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code">
      </div>
      <button type="submit" class="play-btn">▶ Verify</button>
    </form>

    <form method="POST" action="/api/resend_otp" style="margin-top:10px">
      <button type="submit" class="play-btn" style="background:transparent;color:#ffd54a;box-shadow:none;border:2px solid #ffd54a">↻ Resend Code</button>
    </form>

    <div class="footer-note">© DTEMPIRE · v5.0</div>
  </div>
</div>

</body>
</html>
