<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HermesBot — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2e 50%,#0a1a2e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0e0}
.login-box{background:rgba(20,20,40,0.9);border:1px solid #6c3ce0;border-radius:16px;padding:48px;max-width:420px;width:90%;box-shadow:0 0 40px rgba(108,60,224,0.3),0 0 80px rgba(108,60,224,0.1)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:2.2em;background:linear-gradient(135deg,#a855f7,#6c3ce0,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.logo p{color:#888;font-size:0.95em}
label{display:block;margin-bottom:6px;font-size:0.9em;color:#aaa;margin-top:16px}
input{width:100%;padding:12px 16px;border:1px solid #333;border-radius:8px;background:rgba(255,255,255,0.05);color:#e0e0e0;font-size:1em;outline:none;transition:border-color 0.3s}
input:focus{border-color:#a855f7}
.btn{width:100%;padding:14px;margin-top:24px;background:linear-gradient(135deg,#6c3ce0,#a855f7);color:#fff;border:none;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer;transition:transform 0.2s,box-shadow 0.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(168,85,247,0.4)}
.error{background:rgba(255,50,50,0.1);border:1px solid #ff3333;color:#ff6666;padding:10px;border-radius:8px;margin-bottom:16px;text-align:center;font-size:0.9em}
.hint{text-align:center;margin-top:16px;color:#666;font-size:0.85em}
.hint a{color:#a855f7;text-decoration:none}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <h1>⚡ HermesBot</h1>
    <p>Adventure Dashboard</p>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="Your display name" required>
    <label>Discord User ID</label>
    <input type="text" name="user_id" placeholder="Right-click your profile → Copy User ID" required>
    <label>Server ID (optional)</label>
    <input type="text" name="guild_id" placeholder="Discord server ID" value="0">
    <button type="submit" class="btn">Enter the Realm 🔮</button>
  </form>
  <p class="hint">Your data syncs with the <a href="#">Discord bot</a></p>
</div>
</body>
</html>
