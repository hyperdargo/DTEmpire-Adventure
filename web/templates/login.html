<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HermesBot — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2e 50%,#0a1a2e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#e0e0e0}
.login-box{background:rgba(20,20,40,0.9);border:1px solid #6c3ce0;border-radius:16px;padding:48px;max-width:420px;width:90%;box-shadow:0 0 40px rgba(108,60,224,0.3),0 0 80px rgba(108,60,224,0.1)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:2.2em;background:linear-gradient(135deg,#a855f7,#6c3ce0,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.logo p{color:#888;font-size:0.95em}
.discord-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;margin-top:24px;background:#5865F2;color:#fff;border:none;border-radius:8px;font-size:1.1em;font-weight:600;cursor:pointer;transition:all 0.3s;text-decoration:none}
.discord-btn:hover{background:#4752c4;transform:translateY(-2px);box-shadow:0 4px 20px rgba(88,101,242,0.4)}
.discord-btn svg{width:24px;height:24px;fill:#fff}
.error{background:rgba(255,50,50,0.1);border:1px solid #ff3333;color:#ff6666;padding:10px;border-radius:8px;margin-bottom:16px;text-align:center;font-size:0.9em}
.divider{display:flex;align-items:center;margin:24px 0;color:#666;font-size:0.85em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#333}
.divider span{padding:0 12px}
.hint{text-align:center;margin-top:16px;color:#666;font-size:0.85em}
.hint a{color:#a855f7;text-decoration:none}
.features{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}
.feature{background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.15);border-radius:8px;padding:10px;text-align:center;font-size:0.82em}
.feature .icon{font-size:1.4em;display:block;margin-bottom:4px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:0.85em;color:#999;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.form-group input{width:100%;padding:12px 14px;background:rgba(10,10,30,0.8);border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:1em;transition:border-color 0.3s}
.form-group input:focus{outline:none;border-color:#6c3ce0;box-shadow:0 0 12px rgba(108,60,224,0.2)}
.form-group input::placeholder{color:#555}
.manual-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;margin-top:8px;background:linear-gradient(135deg,#6c3ce0,#a855f7);color:#fff;border:none;border-radius:8px;font-size:1.05em;font-weight:600;cursor:pointer;transition:all 0.3s}
.manual-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(108,60,224,0.4)}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">
    <h1>⚡ HermesBot</h1>
    <p>Adventure Dashboard</p>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <a href="/login/discord" class="discord-btn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    Login with Discord
  </a>

  <div class="divider"><span>or enter details manually</span></div>

  <form method="POST" action="/login/manual" id="manual-login">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Your display name" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="user_id">User ID</label>
      <input type="text" id="user_id" name="user_id" placeholder="Discord User ID (numbers)" required>
    </div>
    <div class="form-group">
      <label for="server_id">Server ID</label>
      <input type="text" id="server_id" name="server_id" placeholder="Discord Server/Guild ID (numbers)" required>
    </div>
    <button type="submit" class="manual-btn">Login Manually</button>
  </form>

  <div class="features">
    <div class="feature"><span class="icon">⚔️</span>Battle monsters</div>
    <div class="feature"><span class="icon">🛡️</span>Buy & equip gear</div>
    <div class="feature"><span class="icon">📈</span>Level up & earn XP</div>
    <div class="feature"><span class="icon">🏆</span>Climb leaderboard</div>
  </div>

  <p class="hint">Your Discord progress is automatically synced</p>
</div>
</body>
</html>
